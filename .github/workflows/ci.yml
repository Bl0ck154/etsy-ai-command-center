name: Source checks

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "public/**"
      - "server.js"
      - "package.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "api/**"
      - "public/**"
      - "server.js"
      - "package.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source syntax
        run: npm run check
