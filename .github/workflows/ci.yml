name: Source checks
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "public/**"
      - "workers/**"
      - "scripts/**"
      - "docs/**"
      - "tests/**"
      - "server.js"
      - "README.md"
      - "SECURITY.md"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "api/**"
      - "public/**"
      - "workers/**"
      - "scripts/**"
      - "docs/**"
      - "tests/**"
      - "server.js"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check all source syntax and public repository hygiene
        run: npm run verify:source
