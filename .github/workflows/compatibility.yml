name: Clean install and offline smoke
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  dependency-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOPUBLISH_ENABLED: "false"
      REAL_PUBLISH_RELEASE_APPROVED: "false"
      MESSAGE_TRIGGER_RUNNER_ENABLED: "false"
      MESSAGE_AUTO_TRIGGERS_ENABLED: "false"
      MESSAGE_TELEGRAM_NOTIFICATIONS_ENABLED: "false"
      SOCIAL_AUTOPUBLISH_OWNER_OPT_IN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Clean dependency install
        run: npm ci --no-audit --no-fund
      - name: Quick checks
        run: npm run verify:source
      - name: Redacted configuration preflight
        run: npm run doctor
      - name: Offline regression tests
        run: npx playwright test --config=playwright.unit.config.js tests/auth-boundaries.unit.spec.js tests/agent-runtime-faults.unit.spec.js tests/agent-progress.unit.spec.js tests/stats-bootstrap.unit.spec.js tests/public-hub-configuration.unit.spec.js tests/public-config-doctor.unit.spec.js tests/gpt-router-contract.unit.spec.js tests/social-generate-media.unit.spec.js tests/messages-draft-delivery-application.unit.spec.js tests/etsy-oauth-client.unit.spec.js tests/agent-vision-dependencies.unit.spec.js tests/message-learning-flow.unit.spec.js
      - name: Unconfigured localhost boot and health
        run: |
          PORT=3010 HOST=127.0.0.1 NODE_ENV=development node server.js > /tmp/etsy-public-startup.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3010/healthz > /dev/null 2>&1; then
              echo "Local health check passed"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Server exited before health became available"
              tail -n 80 /tmp/etsy-public-startup.log
              exit 1
            fi
            sleep 1
          done
          tail -n 80 /tmp/etsy-public-startup.log
          exit 1
